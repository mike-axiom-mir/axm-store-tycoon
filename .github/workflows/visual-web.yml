name: Godot Web + Visual Evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: axm-store-tycoon-web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.3-stable
  GODOT_TEMPLATE_DIR: 4.3.stable

jobs:
  build-and-see:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct proven game body
        shell: bash
        run: |
          set -euxo pipefail
          cat bootstrap/source.b64.part* > /tmp/axm-store-source.b64
          base64 --decode /tmp/axm-store-source.b64 > /tmp/axm-store-source.zip
          unzip -t /tmp/axm-store-source.zip
          mkdir -p game
          unzip -q /tmp/axm-store-source.zip -d game
          test -s game/project.godot
          test -s game/scripts/game.gd
          test -s ci/visual-test.mjs

      - name: Apply Pass 3 gameplay/store overrides
        shell: bash
        run: |
          set -euxo pipefail
          cat patches/pass3/game.gd.part* > game/scripts/game.gd
          cp patches/pass3/customer.gd game/scripts/customer.gd
          test -s game/scripts/game.gd
          test -s game/scripts/customer.gd
          grep -q 'AXM MINI MART' game/scripts/game.gd
          grep -q 'GasPump' game/scripts/game.gd

      - name: Apply Pass 4 modern visual overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat patches/pass4/visual_pass4.gd.part* > game/scripts/visual_pass4.gd
          cp patches/pass4/main.tscn game/main.tscn
          cp patches/pass4/project.godot game/project.godot
          test -s game/scripts/visual_pass4.gd
          test -s game/main.tscn
          test -s game/project.godot
          grep -q 'P4Canopy' game/scripts/visual_pass4.gd
          grep -q 'P4CounterGlow' game/scripts/visual_pass4.gd
          grep -q 'VisualPass4' game/main.tscn
          grep -q 'msaa_3d=2' game/project.godot

      - name: Apply Pass 5 AXM Material Surface Fabric
        shell: bash
        run: |
          set -euxo pipefail
          cp patches/pass5/visual_pass5.gd game/scripts/visual_pass5.gd
          cp patches/pass5/main.tscn game/main.tscn
          test -s game/scripts/visual_pass5.gd
          test -s game/main.tscn
          grep -q 'brushed-steel' game/scripts/visual_pass5.gd
          grep -q 'ambient-occlusion' patches/pass5/README.md || true
          grep -q 'VisualPass5' game/main.tscn

      - name: Apply Pass 6 native Monolith PBR atlas
        shell: bash
        run: |
          set -euxo pipefail
          cat patches/pass6/atlas2.part* > /tmp/pass6-atlas.b64
          base64 --decode /tmp/pass6-atlas.b64 > /tmp/pass6-native-material-atlas.zip
          echo "6f8cee3c61416138229a5334c58213fad531b0fe7d9ab40efc667ac93aeb6b10  /tmp/pass6-native-material-atlas.zip" | sha256sum -c -
          unzip -t /tmp/pass6-native-material-atlas.zip
          mkdir -p game/assets/pass6
          unzip -q -j /tmp/pass6-native-material-atlas.zip -d game/assets/pass6
          cp patches/pass6/visual_pass6.gd game/scripts/visual_pass6.gd
          cp patches/pass6/main.tscn game/main.tscn
          test -s game/assets/pass6/material-atlas_basecolor.png
          test -s game/assets/pass6/material-atlas_normal.png
          test -s game/assets/pass6/material-atlas_roughness.png
          test -s game/assets/pass6/material-atlas_metallic.png
          test -s game/scripts/visual_pass6.gd
          grep -q 'VisualPass6' game/main.tscn
          grep -q 'material-atlas_basecolor.png' game/scripts/visual_pass6.gd

      - name: Install Godot 4.3 + export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      - name: Import project in real Godot runtime
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path game --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Failed to load script|Parse Error" /tmp/godot-import.log; then
            echo "Godot reported script errors during import"
            exit 1
          fi

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          cd game
          mkdir -p web visual-evidence
          godot --headless --path . --export-release "Web" web/index.html 2>&1 | tee visual-evidence/godot-export.log
          touch web/.nojekyll
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck

      - name: Install Chromium visual probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve and capture real rendered frame
        shell: bash
        run: |
          python3 -m http.server 8060 --directory game/web >/tmp/axm-store-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8060/index.html >/dev/null && break
            sleep 1
          done
          node ci/visual-test.mjs
          cp /tmp/axm-store-http.log game/visual-evidence/http.log || true
          cp /tmp/godot-import.log game/visual-evidence/godot-import.log || true

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-store-tycoon-visual-evidence
          path: game/visual-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload browser build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: axm-store-tycoon-web
          path: game/web/
          retention-days: 14

      - name: Package Pages artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: game/web/

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build-and-see
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy live browser build
        id: deployment
        uses: actions/deploy-pages@v4
